# One-shot PULL job (RESULTS ONLY) — mounts the persistent `manifolds` storage
# read-only, stages every result file EXCEPT the big acts/ npz dumps into a
# scratch dir, and publishes that dir as job artifacts. So `mlc job download
# artifacts` fetches a small results-only bundle. Driven by pull_results.sh.
# For the raw activations too: `bash pull_results.sh --with-acts` (uses
# pull_preset_full.yml). ignore_mask on the storage mount proved unreliable, so
# staging with tar --exclude is deterministic instead.
job:
  time_limit: 0h20m0s
  flavor: 2cpu-8ram
  generate_name: manifolds-pull
  image: docker-hosted.artifactory.tcsbank.ru/ai-platform/notebook-images/notebook-python-3.12:release-v0.9.12
  work_dir: /work

  storages:
    - name: manifolds
      type: mlc_storage
      src: manifolds
      dst: /work/manifolds
      readwrite: false

  output:
    - type: files
      src: /tmp/out/
      mask: "**/*"

  args:
    - bash
    - -lc
    - >
      set -e; mkdir -p /tmp/out;
      echo '=== staging results (excluding acts/) ===';
      tar cf - --exclude='*/acts/*' --exclude='*/acts' -C /work/manifolds . | tar xf - -C /tmp/out;
      echo '=== staged size ==='; du -sh /tmp/out;
      echo '=== staged file count ==='; find /tmp/out -type f | wc -l; echo files
