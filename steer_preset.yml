# steer_preset.yml — CAUSAL re-run of gemma-4-31B on the mlc H100 platform.
# Confirmatory steering v2 (pre-registered layer L33 = 55% depth, 49 matched-norm
# off-axis controls, 32 stimuli) + P0.2 coupling on 200 stimuli; frees the 6 GB raw
# acts/ first to fit the ~10 GB storage. Runs ONLY these causal stages reusing the acts_mean + battery already in the `manifolds`
# storage from the main run — no re-extraction, no new big files (fits the ~10 GB
# closed contour). Results persist (small) in the storage; the NUMBERS are
# printed by run_scripts.sh's RESULT SUMMARY straight into the job log — read
# them, don't drag files out:
#
#   mlc job submit -p galyukshev --preset-file steer_preset.yml --verbose
#   mlc job logs steer-31b-XXXXXX | sed -n '/=== RESULT SUMMARY/,/=== END SUMMARY/p'
#   #   plus the inline steering slopes:  mlc job logs steer-31b-XXXXXX | grep along_slope
#
# 31B needs an H100 (won't fit V100); the ladder (E2B/E4B/12B) runs steering on
# the DGX V100s via run_scripts.sh directly.
job:
  time_limit: 16h0m0s
  flavor: h100-2x
  generate_name: steer-31b
  image: docker-proxy.artifactory.tcsbank.ru/huggingface/transformers-pytorch-gpu:latest
  work_dir: /work

  storages:
    - name: manifolds
      type: mlc_storage
      src: manifolds
      dst: "/work/manifolds"
      readwrite: true

  input:
    - type: files
      src: ./
      dst: "/work/"
      mask: "run_scripts.sh"
    - type: files
      src: ./scripts/
      dst: "/work/scripts/"
      mask: "*"
    - type: files
      src: ./configs/
      dst: "/work/configs/"
      mask: "*"
    - type: files
      src: ./data/pools/
      dst: "/work/data/pools/"
      mask: "*"
    - type: files
      src: ./src/icom/
      dst: "/work/src/icom/"
      mask: "*"
    - type: files
      src: ./src/icom/battery/
      dst: "/work/src/icom/battery/"
      mask: "*"
    - type: files
      src: ./src/icom/extraction/
      dst: "/work/src/icom/extraction/"
      mask: "*"
    - type: files
      src: ./src/icom/generator/
      dst: "/work/src/icom/generator/"
      mask: "*"
    - type: files
      src: ./src/icom/probes/
      dst: "/work/src/icom/probes/"
      mask: "*"
    - type: files
      src: ./src/icom/utils/
      dst: "/work/src/icom/utils/"
      mask: "*"
    - type: model_registry
      mrid: huggingface-proxy/google/gemma-4-31B-it/419b2efe421994fdfd3394e621983d4cc511cd4f
      dst: /hf_models/

  # No output artifacts: closed contour, ~10 GB, nothing dragged out. The causal
  # results (small) persist in the `manifolds` storage, and run_scripts.sh prints
  # the RESULT SUMMARY (steering slopes, coupling beta, e9b toward-B/C, gate) to
  # the log — read it with `mlc job logs steer-31b-XXXXXX`.
  args:
    - bash
    - -lc
    - >
      (pip install -q "transformers==5.13.0" || pip install -q "git+https://github.com/huggingface/transformers.git@v5.13.0") &&
      pip install -q accelerate scipy scikit-learn pandas pyarrow pyyaml sentencepiece protobuf &&
      export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 TOKENIZERS_PARALLELISM=false MODEL_PATH=/hf_models &&
      echo "=== storage before ===" && { du -sh /work/manifolds/* 2>/dev/null || true; } &&
      rm -rf /work/manifolds/google_gemma-4-31B-it/acts &&
      echo "=== storage after freeing raw acts ===" && { du -sh /work/manifolds/* 2>/dev/null || true; } &&
      chmod +x /work/run_scripts.sh &&
      OUT_ROOT=/work/manifolds MODEL_PATH=/hf_models STAGES=acts_mean,steer,coupling
      ACTS_MEAN_LIMIT=200 N_OFFAXIS=49 STEER_NSTIM=32 STEER_FAMS=s0_zib,s1_size STEER_SCHEME=readout STEER_LAYERS=33
      bash /work/run_scripts.sh google/gemma-4-31B-it
