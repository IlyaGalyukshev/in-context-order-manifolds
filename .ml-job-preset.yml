# .ml-job-preset.yml — in-context ORDER-MANIFOLD experiments (2×H100)
# One job = one model. Uploads the repo to /work, serves the model at /hf_models
# (offline), runs the full per-model paper pipeline via run_scripts.sh, and writes
# results to the `manifolds` storage. To change the model: edit the mrid below and
# put the SAME org/name as the final run_scripts.sh argument.
job:
  time_limit: 48h0m0s
  flavor: h100-2x
  generate_name: order-manifold
  image: docker-proxy.artifactory.tcsbank.ru/huggingface/transformers-pytorch-gpu:latest
  work_dir: /work

  storages:
    - name: manifolds
      type: mlc_storage
      src: manifolds
      dst: "/work/manifolds"
      readwrite: true

  input:
    # mlc's `mask` is single-level (not recursive), and the repo is nested — so enumerate
    # exactly what the pipeline needs (this also keeps the 479MB local data/ out of the upload).
    - type: files
      src: ./
      dst: "/work/"
      mask: "run_scripts.sh"
    - type: files
      src: ./scripts/
      dst: "/work/scripts/"
      mask: "*"
    - type: files
      src: ./configs/
      dst: "/work/configs/"
      mask: "*"
    - type: files
      src: ./data/pools/
      dst: "/work/data/pools/"
      mask: "*"
    - type: files
      src: ./src/icom/
      dst: "/work/src/icom/"
      mask: "*"
    - type: files
      src: ./src/icom/battery/
      dst: "/work/src/icom/battery/"
      mask: "*"
    - type: files
      src: ./src/icom/extraction/
      dst: "/work/src/icom/extraction/"
      mask: "*"
    - type: files
      src: ./src/icom/generator/
      dst: "/work/src/icom/generator/"
      mask: "*"
    - type: files
      src: ./src/icom/probes/
      dst: "/work/src/icom/probes/"
      mask: "*"
    - type: files
      src: ./src/icom/utils/
      dst: "/work/src/icom/utils/"
      mask: "*"
    - type: model_registry
      mrid: huggingface-proxy/google/gemma-4-31B-it/419b2efe421994fdfd3394e621983d4cc511cd4f
      dst: /hf_models/

  args:
    - bash
    - -lc
    - >
      pip install -q accelerate scipy scikit-learn pyyaml sentencepiece protobuf &&
      export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 TOKENIZERS_PARALLELISM=false MODEL_PATH=/hf_models &&
      python3 -c "import transformers; print('[env] image transformers', transformers.__version__)" &&
      chmod +x /work/run_scripts.sh &&
      bash /work/run_scripts.sh google/gemma-4-31B-it
