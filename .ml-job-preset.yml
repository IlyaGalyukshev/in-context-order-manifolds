# .ml-job-preset.yml — in-context ORDER-MANIFOLD experiments (2×H100)
# One job = one model. Uploads the repo to /work, serves the model at /hf_models
# (offline), runs the full per-model paper pipeline via run_scripts.sh, and writes
# results to the `manifolds` storage. To change the model: edit the mrid below and
# put the SAME org/name as the final run_scripts.sh argument.
job:
  time_limit: 48h0m0s
  flavor: h100-2x
  generate_name: order-manifold
  image: docker-proxy.artifactory.tcsbank.ru/huggingface/transformers-pytorch-gpu:latest
  work_dir: /work

  storages:
    - name: manifolds
      type: mlc_storage
      src: manifolds
      dst: "/work/manifolds"
      readwrite: true

  input:
    - type: files
      src: ./
      dst: "/work/"
      mask: "*"
    - type: model_registry
      mrid: huggingface-proxy/google/gemma-4-31B-it/419b2efe421994fdfd3394e621983d4cc511cd4f
      dst: /hf_models/

  args:
    - bash
    - -lc
    - >
      pip install -q git+https://github.com/huggingface/transformers.git@main
      accelerate scipy scikit-learn pyyaml einops sentencepiece protobuf &&
      export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 TOKENIZERS_PARALLELISM=false MODEL_PATH=/hf_models &&
      chmod +x /work/run_scripts.sh &&
      bash /work/run_scripts.sh google/gemma-4-31B-it
